events {
    # 기본값 512로는 리다이렉트 부하에서 커넥션이 모자라 EOF로 끊긴다.
    worker_connections 8192;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Docker 내장 DNS. upstream 블록과 정적 호스트명은 기동 시 한 번만 해석하므로,
    # 백엔드 컨테이너를 재배포하면 옛 IP로 계속 보내 404/502가 난다.
    # proxy_pass에 변수를 쓰면 요청 시점에 다시 해석된다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 리다이렉트 인스턴스 2대에 분산. upstream 대신 변수를 써야 재해석이 되므로
    # request_id 해시로 두 대에 균등 분배한다.
    split_clients "${request_id}" $redirect_backend {
        50%  "redirect-1:8080";
        *    "redirect-2:8080";
    }

    server {
        listen 80;

        # React 정적 산출물 서빙 (SPA 라우팅은 index.html로 fallback)
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri /index.html;
        }

        # /actuator 는 영숫자 8자라 아래 단축코드 정규식에 걸려 redirect로 프록시된다.
        # 정규식 로케이션보다 먼저 잡히도록 ^~ 로 못 박아 관리 엔드포인트를 외부에 열지 않는다.
        location ^~ /actuator {
            return 404;
        }

        location /api/urls {
            set $url_api "url-api:8080";
            proxy_pass http://$url_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/stats {
            set $dashboard "dashboard:8080";
            proxy_pass http://$dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 단축 코드(6~10자 영숫자) → 리다이렉트 풀. 302를 그대로 클라이언트에 전달해야 하므로
        # nginx가 에러/리다이렉트 응답을 가로채지 않게 한다.
        location ~ "^/[A-Za-z0-9]{6,10}$" {
            proxy_intercept_errors off;
            proxy_pass http://$redirect_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
